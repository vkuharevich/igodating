server:
  port: 9003
spring:
  application:
    name: igodating-user-service
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 50
    url: jdbc:postgresql://postgres:5432/igodating
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: chats
        dialect: org.hibernate.dialect.PostgreSQLDialect
default:
  message-limit: 50