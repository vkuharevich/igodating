model:
  path: /lm-model/
  url: djl://ai.djl.huggingface.pytorch/sentence-transformers/all-MiniLM-L6-v2

whitening-matrix:
  selection-limit: 50000
  shrinkage-lambda: 0.1

scheduling:
  whitening-matrix-delay: 10000000
  vector-init-delay: 10000
  vector_init_limit: 100