server:
  port: 9000

spring:
  liquibase:
    enabled: false
  application:
    name: igodating-questionary-service
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 50
    url: jdbc:postgresql://localhost:5432/igodating?current_schema=questionary
    username: root
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        default_schema: questionary
        dialect: org.hibernate.dialect.PostgreSQLDialect

